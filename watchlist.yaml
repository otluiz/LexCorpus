# watchlist.yaml — alvos de coleta do LexCorpus
#
# O scheduler (lexcorpus/scheduler.py — ver BACKLOG) lê este arquivo e
# dispara `scrapy crawl <spider>` com os params de cada alvo cujo cron
# venceu. Versionado no repo: adicionar um concurso = commit de uma linha.
#
# Convenções:
#   banca   — slug canônico (minúsculas, sem acento) — chave do storage
#   spider  — nome do spider Scrapy (scrapy crawl <spider>)
#   params  — repassados como -a chave=valor ao spider
#   cron    — quando coletar (horário local do container; defina TZ)
#   ativo   — false = pausado OU spider ainda não implementado
#
# Frequência sugerida: enquanto o ciclo preliminar→definitivo está aberto
# (semanas após a prova), coletar 2–4x/dia; depois de definitivo, 1x/dia
# basta. O StateStore garante que re-run sem novidade não publica evento.

version: 1

alvos:
  # --- CEBRASPE (API oficial) — spider pronto, pode ativar já -----------
  - banca: cebraspe
    spider: cebraspe
    params: {slug: prf_21}
    cron: "0 6 * * *"          # 1x/dia — ciclo encerrado
    ativo: true

  # Carreira fiscal (26/09) — banca confirmada na página oficial da Cebraspe.
  # Sefaz-AL 2019 (aplicação 2020/21): 2 cargos, 13 PDFs, gabaritos definitivos.
  - banca: cebraspe
    spider: cebraspe
    params: {slug: sefaz_al_19_auditor}
    cron: "10 6 * * *"         # 1x/dia — ciclo encerrado
    ativo: true

  # Sefaz-DF 2019 (SEEC/DF, aplicação 2020): 1 cargo, 5 PDFs. A API publica só
  # o caderno da TARDE (específicos); o de conhecimentos básicos falta na fonte.
  # O concurso novo (2026, Cebraspe, 265 vagas) ainda não tem edital.
  - banca: cebraspe
    spider: cebraspe
    params: {slug: seec_auditor_19}
    cron: "20 6 * * *"         # 1x/dia — ciclo encerrado
    ativo: true

  # --- FGV — spider pronto (18/08) ----------------------------------------
  - banca: fgv
    spider: fgv
    params: {slug: dataprev26}
    cron: "0 */6 * * *"        # 4x/dia — ciclo preliminar→definitivo aberto
    ativo: false               # spider validado; ativar p/ entrar na automação

  # --- FCC — spider pronto (05/08; gabaritos oficiais) ---------------------
  - banca: fcc
    spider: fcc
    params: {slug: dpeba125}
    cron: "0 6,18 * * *"       # 2x/dia
    ativo: false               # spider validado; ativar p/ entrar na automação

  # --- CESGRANRIO — spider pronto (18/08, API pública do portal) -----------
  # Transpetro 2023 (PSP-RH-2023): portal próprio do cliente, mesma API. O
  # evento junta 3 editais (nível médio 2023.1, superior 2023.2, mar 2023.3)
  # -> dividir_editais: um concurso por edital. 51 provas + gabaritos
  # preliminar e final + padrões de resposta = 59 PDFs (crawl de 26/09).
  - banca: cesgranrio
    spider: cesgranrio
    organ: Transpetro
    params: {host: transpetro.cesgranrio.org.br, evento_id: "12",
             concurso: transpetro_2023, dividir_editais: "1"}
    cron: "30 6 * * 1"         # 1x/semana — ciclo encerrado em 2024
    ativo: true

  # Transpetro 2026: evento 22 do portal GERAL (confirmado em 26/09). Prova
  # em nov/dez/2026 — até lá a página só tem editais (o spider não emite
  # nada). Depois da prova, subir para 4x/dia enquanto o ciclo
  # preliminar→definitivo estiver aberto.
  - banca: cesgranrio
    spider: cesgranrio
    organ: Transpetro
    concurso: transpetro_2026
    edital_data: "2026-08-01"
    cargos: [Analista de Sistemas, Administrador, Engenheiro de Produção]
    params: {evento_id: "22", concurso: transpetro_2026}
    cron: "0 7 * * *"          # 1x/dia até a prova
    ativo: true

# Spiders de descoberta: percorrem SÓ listagens (sem baixar PDF) e propõem
# novos alvos. Saída em eventos_debug/descoberta/; promoção ao watchlist
# é manual por enquanto (revisar antes de ativar).
#
# Desde o ADR-0006, alvos novos podem nascer da camada de descoberta
# (lexcorpus/buscador.py + orquestrador.py): o `catalogo.yaml` mantém as
# listas vivas vigentes/passados (ano/banca/cargos), e o watchlist é a
# materialização dos vigentes que já têm spider validado.
descoberta:
  - spider: pci_descoberta     # PCI como índice — nunca como fonte de PDF
    cron: "0 5 * * *"          # ADR-0001: Turnstile + robots.txt /*.pdf
    ativo: false
  - spider: fgv_listagem
    cron: "5 5 * * *"
    ativo: false
  - spider: fcc_listagem
    cron: "10 5 * * *"
    ativo: false
